<!-- Word-like HTML with basic formatting -->
<html xmlns:o="urn:schemas-microsoft-com:office:office"
xmlns:w="urn:schemas-microsoft-com:office:word">
<head>
<style>
/* Word default styles */
p.MsoNormal { 
    font-family: "Calibri", sans-serif;
    font-size: 11pt;
    margin: 0pt;
    mso-style-name: Normal;
}
</style>
</head>
<body>
<p class="MsoNormal" style="font-family: Arial; font-size: 14pt; color: #2E74B5;">
    <b>Title with custom font</b>
</p>
<p class="MsoNormal" style="font-size: 12pt; color: #333333;">
    This is a paragraph with <span style="font-family: Georgia; font-size: 16pt; color: red;">styled text</span> inline.
</p>
<p class="MsoNormal" style="font-size: 11pt;">
    <u>Underlined text</u> and <i>italic text</i> mixed.
</p>
</body>
</html>
