<!-- Word-like HTML with table and borders -->
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">

<head>
    <style>
        table.MsoTableGrid {
            border-collapse: collapse;
            mso-style-name: "Table Grid";
        }
    </style>
</head>

<body>
    <table class="MsoTableGrid" border="1" cellspacing="0" cellpadding="0"
        style="border: solid #4472C4 2.0pt; width: 100%;">
        <thead>
            <tr style="background-color: #4472C4; mso-background-themecolor: accent1;">
                <th style="border: solid #4472C4 1.0pt; padding: 5pt; color: white; font-weight: bold;">
                    Column A
                </th>
                <th style="border: solid #4472C4 1.0pt; padding: 5pt; color: white; font-weight: bold;">
                    Column B
                </th>
                <th style="border: solid #4472C4 1.0pt; padding: 5pt; color: white; font-weight: bold;">
                    Column C
                </th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td style="border: solid #9DC3E6 1.0pt; padding: 5pt; font-family: Calibri; font-size: 11pt;">
                    <p style="margin: 0; color: #1F4E79;">Cell 1</p>
                </td>
                <td style="border: solid #9DC3E6 1.0pt; padding: 5pt; background-color: #DEEAF6;">
                    Cell 2
                </td>
                <td style="border: solid #9DC3E6 1.0pt; padding: 5pt;">
                    Cell 3
                </td>
            </tr>
            <tr>
                <td colspan="2" style="border: solid #9DC3E6 1.0pt; padding: 5pt; text-align: center;">
                    Merged Cell
                </td>
                <td style="border: solid #9DC3E6 1.0pt; padding: 5pt; font-weight: bold; color: #C00000;">
                    Important!
                </td>
            </tr>
        </tbody>
    </table>
</body>

</html>
