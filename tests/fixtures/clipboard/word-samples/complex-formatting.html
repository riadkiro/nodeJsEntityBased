<!-- Word-like HTML with complex mixed formatting -->
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"
    xmlns:v="urn:schemas-microsoft-com:vml">

<head>
    <meta name="Generator" content="Microsoft Word 16">
    <style>
        <!--
        p.MsoNormal,
        li.MsoNormal {
            mso-style-name: Normal;
            margin: 0in;
            font-family: "Calibri", sans-serif;
            mso-fareast-font-family: Calibri;
        }

        p.MsoListParagraph {
            mso-style-name: "List Paragraph";
            margin-left: 0.5in;
        }
        -->
    </style>
    <!--[if gte mso 9]><xml>
<o:OfficeDocumentSettings>
<o:AllowPNG/>
</o:OfficeDocumentSettings>
</xml><![endif]-->
</head>

<body lang="FR">
    <!--[if !vml]-->
    <p class="MsoNormal"
        style="font-family: 'Times New Roman'; font-size: 18pt; color: #2E74B5; mso-style-priority: 99;">
        <b><span style="mso-bidi-font-family: 'Times New Roman';">Heading Level 1</span></b>
    </p>
    <!--[endif]-->

    <p class="MsoNormal" style="line-height: 150%; mso-line-height-rule: exactly;">
        <span style="font-family: Georgia; font-size: 12pt; color: #333;">
            This paragraph uses Georgia font at 12pt with <b style="color: #C00000;">bold red text</b>
            and <span style="background-color: yellow; font-style: italic;">highlighted italic</span>.
        </span>
    </p>

    <o:p></o:p>

    <p class="MsoListParagraph" style="mso-list: l0 level1 lfo1;">
        <!--[if !supportLists]-->
        <span style="font-family: Symbol; mso-fareast-font-family: Symbol; mso-bidi-font-family: Symbol;">
            <span style="mso-list: Ignore;">•<span style="font: 7.0pt 'Times New Roman';">&nbsp;</span></span>
        </span>
        <!--[endif]-->
        <span style="font-family: Verdana; font-size: 10pt;">First list item with Verdana</span>
    </p>

    <p class="MsoListParagraph" style="mso-list: l0 level1 lfo1;">
        <span style="font-family: Verdana; font-size: 10pt; color: #0070C0;">Second item in blue</span>
    </p>

    <p class="MsoNormal">&nbsp;</p>

    <table class="MsoTableGrid" border="1" style="border-collapse: collapse; width: 400px;">
        <tr>
            <td width="200" style="padding: 8px; border: 1px solid #AAA; background: #F0F0F0;">
                <p style="margin: 0; font-family: Consolas; font-size: 9pt; color: #006400;">
                    /* Code block */
                </p>
            </td>
            <td width="200" style="padding: 8px; border: 1px solid #AAA;">
                <p style="margin: 0; font-size: 11pt;">Normal text</p>
            </td>
        </tr>
    </table>
</body>

</html>
